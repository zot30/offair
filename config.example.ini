# offair settings. Copy this file to ~/.config/offair/config.ini and edit it.
# Only [folders] is required; delete or leave out anything you don't want to change.
# After any change, run:  ./offair.py check

[folders]
# Where the recordings arrive (searched with its subfolders).
recordings = /Volumes/Media/Recordings
# Where converted episodes and films go. Point your media server's libraries here.
tv = /Volumes/Media/TV Shows
movies = /Volumes/Media/Movies
# File extensions that count as recordings.
extensions = .mpeg

[share]
# Only if those folders are on a network share. Leave this section out for local disks.
# mount_point: where the share appears on this Mac.
# url: connect to the share once in Finder and save the password in your Keychain;
#      offair then remounts it with this address when it's disconnected.
# host: checked before each run, so a NAS that's switched off isn't treated as an error.
mount_point = /Volumes/Media
url = smb://user@nas._smb._tcp.local/Media
host = nas.local
port = 445

[schedule]
# The nightly job starts at launch_at and converts until window_end. A recording that
# has started always finishes. After changing launch_at, run: ./offair.py install
window_start = 04:00
window_end = 07:30
launch_at = 04:30

[encode]
# ffmpeg deinterlace filter (yadif or bwdif). Leave empty for none.
deinterlace = yadif
# libx264 quality (lower is better and bigger) and speed preset.
crf = 20
preset = fast
audio_bitrate = 192k
# Audio tracks to prefer, in any order. Otherwise the first audio track is used.
preferred_audio = ac3, eac3
# Apple's hardware encoder: much faster, but compare the quality before leaving it on.
hardware_encoder = no
hardware_bitrate = 8M

[ads]
# Mark ad breaks as chapters called "Ads" (nothing is cut out). Needs Comskip: see README.
detect = no
comskip = ~/.local/bin/comskip
# comskip_ini = ~/.config/offair/comskip.ini

[files]
# Keep the original recordings after converting. Switch to no only after a week or so
# of good runs: from then on each original is deleted once its MP4 has passed the checks.
keep_originals = yes
# Move finished MP4s into the tv and movies folders. With no, they stay beside the recording.
file_into_library = yes
# Ignore recordings smaller than this, or modified more recently than this.
min_size_mb = 50
min_age_minutes = 20
# Stop retrying a recording after this many failed attempts.
max_failures = 3

[notifications]
title = Offair
# Notify after this many nights in a row with the share unreachable.
share_down_nights = 3

[status]
# The status page is at http://localhost:<port>, on this Mac only.
port = 8765
# To open it from other devices at home (http://<this-mac's-name>.local:<port>), turn this
# on. Add a password if not everyone on your network should be able to press its buttons
# (any user name works). Then run: ./offair.py install
on_network = no
# password =
# Keep a read-only copy of the page (index.html) in this folder, for a web server such as
# a NAS to serve, so the page can be read while this Mac is asleep.
# copy_to = /Volumes/Media/Recordings/.offair-status

[plex]
# Have Plex find the ad breaks in each newly filed recording, so it shows a Skip
# Commercials button. Needs Plex Pass. See "Ad breaks" in the README before turning on.
detect_ads = no
# url = http://nas.local:32400
# A file holding your Plex token and nothing else (chmod 600).
# token_file = ~/.config/offair/plex-token
