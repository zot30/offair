; Settings for Comskip, which offair runs to find ad breaks when [ads] detect = yes.
; Everything not listed here uses Comskip's defaults. To tune detection for your
; channels, see Comskip's own comskip.ini and tuning guide, add settings below, and
; point [ads] comskip_ini at your copy.

; Required: offair reads the breaks from the .edl file.
output_edl=1
